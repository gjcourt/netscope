name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev linux-libc-dev

      - name: Compile BPF object (so go:embed succeeds)
        run: make bpf

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go mod tidy diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint deploy/helm/netscope

      - name: helm template (smoke render)
        run: helm template netscope deploy/helm/netscope --namespace netscope-stage > /dev/null

  # kernel-smoke: load the compiled BPF .o against a real kernel in a VM and
  # attempt each attach the production agent performs. Catches verifier
  # rejections that the compile-only `lint` job above cannot see — see
  # docs/postmortems/2026-05-10-srtt-verifier-iterations.md and
  # docs/postmortems/2026-06-16-dns-probe-read-helper4.md.
  #
  # Kernel: bzImage-v6.18-fedora38 from danobi/vmtest's test_assets. The
  # production Talos nodes ship 6.18.x (Talos v1.12.4 → 6.18.9), and 6.18
  # includes every kernel symbol the agent traces (tcx is 6.6+,
  # tcp_rcv_established and udp_recvmsg are long-standing GPL exports). It is
  # also built with CONFIG_DEBUG_INFO_BTF=y so fentry/fexit programs load.
  #
  # kernel_args: lockdown=confidentiality — THIS is the load-bearing fix for
  # the DNS bpf_probe_read#4 crashloop, and it is NOT optional. The root cause
  # was NOT a toolchain/clang difference (that earlier theory was wrong): the
  # kernel gates the probe_read-family helpers for tracing programs behind
  #
  #   case BPF_FUNC_probe_read:
  #     return security_locked_down(LOCKDOWN_BPF_READ_KERNEL) < 0
  #            ? NULL : &bpf_probe_read_compat_proto;   // kernel/trace/bpf_trace.c
  #
  # Talos boots every node with `lockdown=confidentiality` (see /proc/cmdline
  # on the cluster), which makes security_locked_down(LOCKDOWN_BPF_READ_KERNEL)
  # return < 0, so the proto is NULL and ANY probe_read variant
  # (#4 bpf_probe_read, #112 bpf_probe_read_user, #113 bpf_probe_read_kernel)
  # is rejected from fentry/fexit with "program of this type cannot use helper
  # bpf_probe_read#4". A vmtest VM boots WITHOUT lockdown by default, so it
  # happily accepted the probe_read object — that is exactly why the v2
  # per-domain DNS feature passed kernel-smoke and then crashlooped on the
  # cluster. Booting the smoke VM with lockdown=confidentiality reproduces the
  # Talos gate on the stock fedora38 kernel (verified: the pre-fix object is
  # rejected with bpf_probe_read#4 only when this arg is present). Do NOT
  # remove this arg.
  #
  # Toolchain fidelity is still worth keeping: we compile the .o with the same
  # bookworm clang-14 the shipped image uses (below), so the smoke verifies
  # byte-for-byte what we deploy. Keep this image tag in sync with the
  # Dockerfile's builder stage.
  kernel-smoke:
    needs: lint
    runs-on: ubuntu-latest
    # Guard against vmtest hangs (kernel panic in init, command that never
    # returns) which would otherwise consume the full GHA 6h default. The
    # smoke itself is sub-second; 10m is generous for boot + setup overhead.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Compile BPF object (bookworm clang — same as shipped image)
        # Run `make bpf` inside golang:1.23-bookworm, the exact builder image
        # the Dockerfile uses, so the .o the smoke loads is byte-for-byte the
        # one we deploy. Compiling with ubuntu-latest's clang here is what let
        # the bpf_probe_read#4 regression slip through in #14 — the CI clang
        # emitted a direct load while the bookworm image emitted #4. Keep the
        # image tag in sync with the Dockerfile builder FROM.
        run: |
          docker run --rm -v "$PWD":/src -w /src golang:1.23-bookworm bash -c '
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-libc-dev
            clang --version
            make bpf
          '

      - name: Build cismoke binary
        # Static binary so it runs against whatever libc (if any) the vmtest
        # rootfs ships with. CGO is already off for cilium/ebpf builds but be
        # explicit so a future toolchain default doesn't break the VM run.
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build \
            -ldflags="-s -w" \
            -o bin/cismoke \
            ./cmd/cismoke

      - name: Run kernel-load smoke (vmtest)
        uses: danobi/vmtest-action@v0.9
        with:
          # bzImage-v6.18-fedora38 — 6.18 matches Talos 6.18.x in production,
          # and the fedora38 flavor is built with CONFIG_DEBUG_INFO_BTF=y so
          # fentry/fexit programs (which need kernel BTF to resolve struct
          # field offsets) and maps using BTF_KIND_DATASEC actually load.
          # The "-default" flavor is a minimal kernel without BTF and rejects
          # any fentry attach with "function not implemented" before the
          # verifier even sees the program. If this URL 404s, fall back to
          # other vmtest-managed kernel images listed at
          # https://github.com/danobi/vmtest/releases/tag/test_assets
          kernel_url: https://github.com/danobi/vmtest/releases/download/test_assets/bzImage-v6.18-fedora38
          # Reproduce the Talos lockdown gate that rejects probe_read helpers
          # in tracing programs. Without this the smoke is a false-green for the
          # entire bpf_probe_read#{4,112,113} regression class. See the long
          # comment above this job for the kernel-source gate this exercises.
          kernel_args: lockdown=confidentiality
          # Absolute path; vmtest-action mirrors the host workspace into the
          # guest, so $GITHUB_WORKSPACE resolves the same way inside the VM.
          command: ${{ github.workspace }}/bin/cismoke

  image:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            ref="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            slug="${ref//\//-}"
            echo "branch=${slug}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: |
            ghcr.io/gjcourt/netscope:${{ steps.tags.outputs.branch }}
            ghcr.io/gjcourt/netscope:${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
