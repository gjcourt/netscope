name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev linux-libc-dev

      - name: Compile BPF object (so go:embed succeeds)
        run: make bpf

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go mod tidy diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint deploy/helm/netscope

      - name: helm template (smoke render)
        run: helm template netscope deploy/helm/netscope --namespace netscope-stage > /dev/null

  # kernel-smoke: load the compiled BPF .o against a real kernel in a VM and
  # attempt each attach the production agent performs. Catches verifier
  # rejections that the compile-only `lint` job above cannot see — see
  # docs/postmortems/2026-05-10-srtt-verifier-iterations.md for the trap this
  # exists to plug.
  #
  # Pinned to bzImage-v6.18-default from danobi/vmtest's test_assets. The
  # production Talos nodes ship 6.18.x, and 6.18 includes every kernel symbol
  # the agent traces (tcx is 6.6+, tcp_rcv_established and udp_recvmsg are
  # long-standing GPL exports). If the kernel rename-shuffle ever drops one
  # of those symbols the smoke surfaces it as a clear AttachTracing failure
  # rather than a silent CI green / production red.
  kernel-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev linux-libc-dev

      - name: Compile BPF object
        run: make bpf

      - name: Build cismoke binary
        # Static binary so it runs against whatever libc (if any) the vmtest
        # rootfs ships with. CGO is already off for cilium/ebpf builds but be
        # explicit so a future toolchain default doesn't break the VM run.
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build \
            -ldflags="-s -w" \
            -o bin/cismoke \
            ./cmd/cismoke

      - name: Run kernel-load smoke (vmtest)
        uses: danobi/vmtest-action@v0.9
        with:
          # bzImage-v6.18-default — matches Talos 6.18.x in production. If
          # this URL ever 404s, fall back to vmtest-managed kernel images
          # listed at https://github.com/danobi/vmtest/releases/tag/test_assets
          kernel_url: https://github.com/danobi/vmtest/releases/download/test_assets/bzImage-v6.18-default
          # Absolute path; vmtest-action mirrors the host workspace into the
          # guest, so $GITHUB_WORKSPACE resolves the same way inside the VM.
          command: ${{ github.workspace }}/bin/cismoke

  image:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            ref="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            slug="${ref//\//-}"
            echo "branch=${slug}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: |
            ghcr.io/gjcourt/netscope:${{ steps.tags.outputs.branch }}
            ghcr.io/gjcourt/netscope:${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
