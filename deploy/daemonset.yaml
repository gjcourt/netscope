---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netscope-agent
  namespace: netscope-stage
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netscope-agent
  namespace: netscope-stage
  labels:
    app.kubernetes.io/name: netscope
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netscope
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netscope
        app.kubernetes.io/component: agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: netscope-agent
      hostNetwork: true
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      # Phase 0: only deploy to one stage worker. Remove this nodeSelector
      # to roll across all stage nodes once we're confident.
      nodeSelector:
        kubernetes.io/hostname: talos-18u-ski
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: ghcr.io/gjcourt/netscope:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: NETSCOPE_IFACE
              value: "eno1"
          ports:
            - name: metrics
              containerPort: 9101
              hostPort: 9101
              protocol: TCP
          securityContext:
            privileged: false
            runAsUser: 0
            # CAP_SYS_ADMIN widens the syscall surface; pin to the kubelet's
            # default seccomp filter rather than running unconfined.
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              add:
                - BPF
                - PERFMON
                - NET_ADMIN
                # SYS_ADMIN is required for bpf(BPF_PROG_GET_NEXT_ID),
                # which the agent uses at startup to discover Cilium's
                # ingress program for tcx anchor placement. The plan
                # noted this as a likely requirement on Talos.
                - SYS_ADMIN
              drop:
                - ALL
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9101
              host: 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9101
              host: 127.0.0.1
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
