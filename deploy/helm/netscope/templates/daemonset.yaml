apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "netscope.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netscope.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "netscope.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "netscope.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.metrics.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "netscope.serviceAccountName" . }}
      hostNetwork: true
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "netscope.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NETSCOPE_IFACE
              value: {{ .Values.iface | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              {{- if gt (int .Values.metrics.hostPort) 0 }}
              hostPort: {{ .Values.metrics.hostPort }}
              {{- end }}
              protocol: TCP
          securityContext:
            privileged: false
            runAsUser: 0
            capabilities:
              add:
                {{- range .Values.capabilities }}
                - {{ . }}
                {{- end }}
              drop:
                - ALL
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.metrics.port }}
              host: 127.0.0.1
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.metrics.port }}
              host: 127.0.0.1
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }}
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
